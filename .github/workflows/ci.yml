name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GitFlow gate: main only accepts merges from hotfix/*, release/*, or
  # develop. Feature/fix/chore branches must target develop first. This is a
  # required check, so a PR to main from a feature branch simply can't merge.
  branch-gate:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce source branch
        run: |
          head="${{ github.head_ref }}"
          case "$head" in
            hotfix/*|release/*|release-please--*|develop)
              echo "OK: $head may merge to main" ;;
            *)
              echo "::error::Branch '$head' cannot merge into main. GitFlow: merge feat/fix/chore work into 'develop' first, then release-please/hotfix branches into main."
              exit 1 ;;
          esac

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          filter: blob:none

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          cache: true

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build proxy bundle
        run: bun run build

      - name: Bundle smoke test
        run: |
          node proxy-bundle.mjs &
          PROXY_PID=$!
          sleep 2
          curl -sf http://127.0.0.1:42100/health | grep -q '"status":"ok"'
          kill $PROXY_PID

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          filter: blob:none

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          cache: true

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test
