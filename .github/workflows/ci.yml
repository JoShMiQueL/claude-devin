name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none

      - uses: oven-sh/setup-bun@v2
        with:
          cache: true

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build proxy bundle
        run: bun run build

      - name: Bundle smoke test
        run: |
          node proxy-bundle.mjs &
          PROXY_PID=$!
          sleep 2
          curl -sf http://127.0.0.1:42100/health | grep -q '"status":"ok"'
          kill $PROXY_PID

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none

      - uses: oven-sh/setup-bun@v2
        with:
          cache: true

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test
